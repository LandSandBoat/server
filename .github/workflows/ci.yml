name: CI (Checks only)

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      lua: ${{ steps.filter.outputs.lua }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          ref: ${{ github.ref }}
          filters: |
            cpp:
              - 'src/**/*.cpp'
              - 'src/**/*.h'
              - 'modules/**/*.cpp'
              - 'modules/**/*.h'
              - '**/CMakeLists.txt'
              - 'cmake/**/*.cmake'
            lua:
              - 'scripts/**/*.lua'
              - 'modules/**/*.lua'

  check_sanity:
    name: Sanity Checks
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.cpp == 'true' || needs.detect_changes.outputs.lua == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade -r ./tools/requirements.txt

      - name: Run checks
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./tools/ci/sanity_checks.sh "origin/${{ github.event.pull_request.base.ref }}"
          else
            ./tools/ci/sanity_checks.sh "${{ github.event.before }}"
          fi

  no_relevant_changes:
    name: No Relevant Changes
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.cpp != 'true' && needs.detect_changes.outputs.lua != 'true' }}
    steps:
      - name: Skip
        run: echo "No C++/Lua changes. CI completed."
