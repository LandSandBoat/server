name: CI (C++ build + Lua check)

on:
  push:
    branches: [custom]
  pull_request:
    branches: [base, custom]
  workflow_dispatch:

jobs:
  build_cpp:
    name: Build (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends --quiet \
            ninja-build \
            build-essential \
            cmake \
            git \
            libluajit-5.1-dev \
            libmariadb-dev-compat \
            libssl-dev \
            libzmq3-dev \
            zlib1g-dev

      - name: Configure
        run: |
          cmake -G Ninja -S . -B build --fresh -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build

  check_lua:
    name: Check (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # まずは超軽量の「構文チェック」例（luajitで読み込みテスト）
      - name: Install luajit
        run: |
          sudo apt update
          sudo apt install -y luajit

      - name: Lua syntax check
        run: |
          # luajit -b は output 指定が必須。構文チェック目的で一時ファイルへ出力する。
          set -euo pipefail
          tmp_out="$(mktemp)"
          while IFS= read -r -d '' f; do
            luajit -b "$f" "$tmp_out"
          done < <(find ./scripts ./modules -type f -name "*.lua" -print0 2>/dev/null)
