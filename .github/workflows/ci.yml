name: CI (C++ build + Lua check)

on:
  push:
    branches: [custom]
  pull_request:
    branches: [base, custom]
  workflow_dispatch:

jobs:
  build_cpp:
    name: Build (C++)
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: ubuntu-24.04
      compiler: gcc
      compiler_version: 14
      build_type: Debug
      build_modules: false
      tracy: false
      upload_artifact: false
      clang_tidy: false

  check_lua:
    name: Check (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # まずは超軽量の「構文チェック」例（luajitで読み込みテスト）
      - name: Install luajit
        run: |
          sudo apt update
          sudo apt install -y luajit

      - name: Lua syntax check
        run: |
          # luajit -b は output 指定が必須。構文チェック目的で一時ファイルへ出力する。
          set -euo pipefail
          tmp_out="$(mktemp)"
          while IFS= read -r -d '' f; do
            luajit -b "$f" "$tmp_out"
          done < <(find ./scripts ./modules -type f -name "*.lua" -print0 2>/dev/null)
