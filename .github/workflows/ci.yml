name: CI (C++ build + Lua check)

on:
  push:
    branches: [custom]
  pull_request:
    branches: [base, custom]
  workflow_dispatch:

jobs:
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      lua: ${{ steps.filter.outputs.lua }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - 'src/**/*.cpp'
              - 'src/**/*.h'
              - 'modules/**/*.cpp'
              - 'modules/**/*.h'
              - '**/CMakeLists.txt'
              - 'cmake/**/*.cmake'
            lua:
              - 'scripts/**/*.lua'
              - 'modules/**/*.lua'

  build_cpp:
    name: Build (C++)
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.cpp == 'true' }}
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: ubuntu-24.04
      compiler: gcc
      compiler_version: 14
      build_type: Debug
      build_modules: false
      tracy: false
      upload_artifact: false
      clang_tidy: false

  check_lua:
    name: Check (Lua)
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.lua == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # まずは超軽量の「構文チェック」例（luajitで読み込みテスト）
      - name: Install luajit
        run: |
          sudo apt update
          sudo apt install -y luajit

      - name: Lua syntax check
        run: |
          # luajit -b は output 指定が必須。構文チェック目的で一時ファイルへ出力する。
          set -euo pipefail
          tmp_out="$(mktemp)"
          while IFS= read -r -d '' f; do
            luajit -b "$f" "$tmp_out"
          done < <(find ./scripts ./modules -type f -name "*.lua" -print0 2>/dev/null)

  no_relevant_changes:
    name: No Relevant Changes
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.cpp != 'true' && needs.detect_changes.outputs.lua != 'true' }}
    steps:
      - name: Skip
        run: echo "No C++/Lua changes. CI completed."
