name: CI (C++ build + Lua check)

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]

jobs:
  build_cpp:
    name: Build (C++)
    runs-on: ubuntu-latest
    # C++/CMake まわりが変わったときだけ実行
    if: |
      github.event_name == 'pull_request' ||
      contains(join(github.event.commits.*.modified, ' '), '.cpp') ||
      contains(join(github.event.commits.*.modified, ' '), '.h') ||
      contains(join(github.event.commits.*.modified, ' '), 'CMakeLists.txt') ||
      contains(join(github.event.commits.*.modified, ' '), '.cmake')
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git \
            libmariadb-dev libluajit-5.1-dev libssl-dev zlib1g-dev

      - name: Configure
        run: |
          cmake -S . -B build

      - name: Build
        run: |
          cmake --build build -j $(nproc)

  check_lua:
    name: Check (Lua)
    runs-on: ubuntu-latest
    # Lua が変わったときだけ実行
    if: |
      github.event_name == 'pull_request' ||
      contains(join(github.event.commits.*.modified, ' '), '.lua')
    steps:
      - uses: actions/checkout@v4

      # まずは超軽量の「構文チェック」例（luajitで読み込みテスト）
      - name: Install luajit
        run: |
          sudo apt update
          sudo apt install -y luajit

      - name: Lua syntax check
        run: |
          # 例: 全luaを luajit -b でバイトコード化して構文エラー検出
          # ※プロジェクトによっては読み込み副作用があるので必要なら対象ディレクトリを絞る
          find . -type f -name "*.lua" -print0 | xargs -0 -n 1 luajit -b
