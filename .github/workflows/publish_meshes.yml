name: Publish Meshes Docker Image

on:
  push:
    branches:
      - base
    # These are submodules, so a bump changes the gitlink path itself, not anything beneath it.
    paths:
      - 'navmeshes'
      - 'ximeshes'
      - '.gitmodules'
      - 'docker/meshes.Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel: a cancelled run leaves its revision tag unpublished.
  cancel-in-progress: false

jobs:
  Meshes_Build:
    name: Build and Publish ximeshes Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Placeholder value. Actual value set in the first step.
      REPO_OWNER: 'landsandboat'
    steps:
      - name: Lowercase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true

      # Consumers need to know whether an image matches the meshes their branch pins.
      - name: Compute meshes revision
        id: meshes_rev
        run: echo "rev=$(git ls-tree HEAD navmeshes ximeshes | sha256sum | cut -c1-12)" >>${GITHUB_OUTPUT}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/ximeshes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.meshes_rev.outputs.rev }}
          labels: |
            org.opencontainers.image.authors=LandSandBoat & EdenServer Dev Teams
            org.opencontainers.image.title=FFXI Meshes
            org.opencontainers.image.description=Line-of-sight and navigation meshes for use with LandSandBoat server.

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          context: .
          file: ./docker/meshes.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
