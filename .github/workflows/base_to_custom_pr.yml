name: Base to Custom PR

on:
  push:
    branches:
      - base
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  open_or_update_pr:
    name: Open or Update PR
    runs-on: ubuntu-latest
    steps:
      - name: Ensure base has changes against custom
        id: compare
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = 'custom';
            const headBranch = 'base';

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${baseBranch}...${headBranch}`,
            });

            core.info(`ahead_by(base->custom): ${compare.data.ahead_by}`);
            core.setOutput('ahead_by', String(compare.data.ahead_by));

      - name: Find existing PR
        id: find_pr
        if: ${{ steps.compare.outputs.ahead_by != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:base`,
              base: 'custom',
              per_page: 1,
            });

            if (prs.data.length > 0) {
              core.info(`Existing PR: #${prs.data[0].number}`);
              core.setOutput('number', String(prs.data[0].number));
              core.setOutput('url', prs.data[0].html_url);
            }

      - name: Create PR if missing
        if: ${{ steps.compare.outputs.ahead_by != '0' && steps.find_pr.outputs.number == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Sync base into custom',
              head: 'base',
              base: 'custom',
              body: [
                'Automated PR to sync changes from `base` into `custom`.',
                '',
                '- Source: `base`',
                '- Target: `custom`',
              ].join('\n'),
              maintainer_can_modify: true,
            });

            core.notice(`Created PR #${created.data.number}: ${created.data.html_url}`);

      - name: Report existing PR
        if: ${{ steps.compare.outputs.ahead_by != '0' && steps.find_pr.outputs.number != '' }}
        run: echo "PR already exists: ${{ steps.find_pr.outputs.url }}"

      - name: Report no-op
        if: ${{ steps.compare.outputs.ahead_by == '0' }}
        run: echo "No base->custom changes. Nothing to do."
