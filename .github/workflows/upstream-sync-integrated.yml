name: Upstream Sync & PR to Custom

on:
  schedule:
    - cron: "0 */6 * * *" # 6時間おき
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/LandSandBoat/server.git
          git fetch upstream base --prune
          git fetch origin base --prune
          git fetch origin custom --prune

      - name: Update base from upstream
        id: update_base
        run: |
          git checkout base
          # 本家の更新を自分のbaseにマージ（fast-forwardを試行）
          if git merge-base --is-ancestor origin/base upstream/base; then
            echo "Fast-forwarding base to upstream/base"
            git merge --ff-only upstream/base
            git push origin base
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "Base and upstream have diverged. Attempting merge..."
            if git merge upstream/base -m "Merge upstream/base into base"; then
                git push origin base
                echo "updated=true" >> $GITHUB_OUTPUT
            else
                echo "Merge conflict in base. Manual intervention required."
                exit 1
            fi
          fi

      - name: Create or update PR to custom
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "base";
            const base = "custom";

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`,
            });

            if (compare.data.ahead_by === 0) {
              core.info("No changes in base to merge into custom.");
              return;
            }

            const title = "Sync base into custom";
            const body = [
              "本家 (LandSandBoat/server) の更新が `base` に反映されました。",
              "`custom` ブランチへの取り込みを確認してください。",
              "",
              "- Source: `base` (Auto-updated from upstream)",
              "- Target: `custom`"
            ].join("\n");

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
              per_page: 1,
            });

            if (prs.data.length > 0) {
              const pr = prs.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.info(`Updated existing PR #${pr.number}`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
              });
              core.info(`Created PR #${created.data.number}`);
            }
