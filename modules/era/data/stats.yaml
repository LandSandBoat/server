    66: {a:   0, b:  0, c:  0, d:  0, e:  0, f:  0, g:  0}
    67: {a:   0, b:  0, c: 20, d:  0, e:  0, f: 20, g: 20}
    68: {a:   0, b:  0, c:  0, d: 20, e: 20, f:  0, g:  0}
    69: {a:  20, b: 20, c:  0, d:  0, e:  0, f: 20, g: 20}
    70: {a:   0, b:  0, c:  0, d:  0, e:  0, f:  0, g:  0}
    71: {a:   0, b:  0, c: 20, d: 20, e: 20, f:  0, g:  0}
