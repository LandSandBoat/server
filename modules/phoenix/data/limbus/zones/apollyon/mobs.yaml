# Legacy level 75 Limbus Apollyon layout.
# Matches the last modules/phoenix/sql/limbus state before the yaml conversion: phoenixffxi/Phoenix PR 194
# (CS pool split, delay corrections) plus PR 190 (NE Apollyon audit), as merged on beta on September 4, 2026.
# The retail layout is replaced whole: core spawns the legacy Limbus does not use are deleted, and
# every redefined spawn nulls its core region because a patch cannot delete and recreate one key.
# Armoury_Crate_Recover is shared by the four corner floors and defined once under SW.

