# Legacy level 75 Limbus Temenos layout.
# Matches modules/phoenix/sql/limbus at phoenixffxi/Phoenix PR 194 (groups, pools and spawn points).
# The retail layout is replaced whole: core spawns the legacy Limbus does not use are deleted, and
# every redefined spawn nulls its core region because a patch cannot delete and recreate one key.
# Same-name mobs on several floors carry a suffix and pin the entity name with script (_E, _Fourth).

