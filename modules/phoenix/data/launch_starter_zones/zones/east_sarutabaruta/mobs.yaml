# Launch starter zones for east_sarutabaruta.
# Adds 200 level 1 mobs, 100 of each type, using the original mobs' spawn regions.
# The original non-aggressive mobs listed below use a 60-second respawn setting.
# NMs, aggressive mobs, quest/scripted mobs, fished mobs, event mobs, and
# night/evening/weather/fog spawns keep their normal timers.
# NM placeholders keep their normal timers through the individual spawn overrides below.
# Other mobs of the same type use the 60-second setting.
# Dropping a quest item does not make a normal mob a quest mob.
# Extra mobs keep the original loot and respawn after 15 seconds.
# pxi_launch_names.lua blocks their drops if the credited killer gets no EXP.
# Disable this data module and pxi_launch_names.lua together, then restart.

templates:

  Bumblebee:
    attributes:
      spawn:
        respawn: 60

  Carrion_Crow:
