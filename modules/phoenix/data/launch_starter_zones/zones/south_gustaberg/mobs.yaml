# Launch starter zones for south_gustaberg.
# Temporary launch-week module: faster trash respawns, loot one TH bracket down, 150 level 1 mobs per zone.
# To end it, remove phoenix/data/launch_starter_zones from modules/init.txt and restart.

templates:

  # -- Custom templates for mobs the core file lacks, scaffolded from the module's mob_groups/mob_pools inserts --

  Huge_Hornet_Launch:
    id:            2000
    display_name:  Huge_Hornet
    species:       yellow_bee
    skill_list_id: 48
    attributes:
      combat:
        skill: dagger
      jobs: [war, war]
      render:
        look:
          type:  standard
          model: 272
        entity_flags:  129
        animation_sub:   8
        hitbox:          8

