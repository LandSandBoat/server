      steal: sleepshroom
      despoil:
        woozyshroom:       0
        sleepshroom:       0
        danceshroom:       0
        agaricus_mushroom: 0

  River_Crab:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item:   chunk_of_rock_salt
        - chance: uncommon
          item:   chunk_of_lufet_salt
