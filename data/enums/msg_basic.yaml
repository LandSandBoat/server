# yaml-language-server: $schema=../schemas/enums/_enum.schema.json

# Ids and comment text come from the client's battle messages (ROM/27/72.DAT).
# Names that predate this file keep their LSB name.
# Names for new ids are generated from the message text:
# - take the text as one line
# - keep placeholders as words (actor, target, number, spell, ...) and drop possessives
# - drop the filler words: the, a, an, that, are, of, to, is, you, from, and, have, your
# - slug it and keep the first 10 words
# - a name that repeats, or matches an existing name, gets _<id>

